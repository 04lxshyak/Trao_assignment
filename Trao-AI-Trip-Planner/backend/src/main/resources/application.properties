server.port=${PORT:8080}
server.address=0.0.0.0

spring.application.name=trip-planner
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/trip_planner}

app.jwt.secret=${JWT_SECRET:change-me-to-a-very-long-random-secret-of-at-least-32-characters}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:10080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
