services:
  - type: web
    name: trao-trip-planner-api
    runtime: docker
    plan: free
    dockerfilePath: ./Trao-AI-Trip-Planner/backend/Dockerfile
    dockerContext: ./Trao-AI-Trip-Planner/backend
    healthCheckPath: /actuator/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: 10080
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
