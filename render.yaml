services:
  - type: web
    name: trao-trip-planner-api
    env: java
    plan: free
    buildCommand: cd Trao-AI-Trip-Planner/backend && mvn clean package -DskipTests
    startCommand: java -jar Trao-AI-Trip-Planner/backend/target/trip-planner-0.0.1-SNAPSHOT.jar
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: 10080
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
